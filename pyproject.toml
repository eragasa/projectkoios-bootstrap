[project]
name = "projectkoios-bootstrap"
version = "0.1.0"
description = "Bootstrap and harness management for Project Koios"
requires-python = ">=3.12"

[project.scripts]
projectkoios = "projectkoios.bootstrap.cli:main"

[tool.pytest.ini_options]
python_files = ["test_*.py", "__*__*__*.py"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "src/python"

[tool.setuptools.packages.find]
where = ["src/python"]
