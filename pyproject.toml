[project]
name = "projectkoios-bootstrap"
version = "0.1.0"
description = "Bootstrap and harness management for Project Koios"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project.scripts]
projectkoios = "projectkoios.bootstrap.cli:main"

[tool.pytest.ini_options]
python_files = ["test_*.py", "__*__*__*.py"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "src/python"

[tool.setuptools.packages.find]
where = ["src/python"]
