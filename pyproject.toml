[project]
name = "projectkoios-bootstrap"
version = "0.1.0"
description = "Bootstrap and harness management for Project Koios"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.25.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "types-jsonschema>=4.25.1.20250822",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project.scripts]
projectkoios = "projectkoios.cli.main:main"

[tool.pytest.ini_options]
python_files = ["test_*.py", "__*__*__*.py"]
testpaths = ["tests"]
pythonpath = ["src/python", "."]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "src/python"

[tool.setuptools.packages.find]
where = ["src/python"]
