name: plan-feature
description: Plan a new feature — scope, approach, implementation steps, and open questions
provider: pi

nodes:
  - id: gather-context
    bash: |
      echo "=== Maps ==="
      for f in maps/*.md; do echo "--- $f ---"; head -50 "$f"; done
      echo "=== Existing ADRs ==="
      for f in architecture/*.md; do echo "--- $f ---"; head -10 "$f"; done

  - id: gather-routing
    bash: |
      if [ -f archon/prompts/harness-routing.md ]; then
        cat archon/prompts/harness-routing.md
      elif [ -f architecture/harness-boundaries.md ]; then
        cat architecture/harness-boundaries.md
      else
        cat <<'EOF'
      # Harness sandbox message delivery

      When producing a plan for Project Koios, assign each step to exactly one harness.

      ## Harness definitions

      - `archon/` — architecture decisions, ADRs, planning, design review, workflow authoring
      - `opencode/` — implementation, tests, validation, runtime debugging, consistency review
      - `goose/` — research support, source ingestion, vault curation, note organization, UI-bootstrap knowledge tasks

      ## Rules

      - Send planning and durable design records to the `archon/` sandbox.
      - Send code and validation work to the `opencode/` sandbox.
      - Send research and note-creation work to the `goose/` sandbox.
      - If a step mixes concerns, split it into separate steps.
      - Always call out handoff points explicitly.

      ## Output requirement

      For every implementation plan, include a harness assignment section with:
      - step number
      - owner harness
      - expected artifact passed to the next harness
      EOF
      fi

  - id: plan
    prompt: |
      Plan a new feature for Project Koios.

      Feature request: $ARGUMENTS

      Repository context:
      $gather-context.output

      Harness sandbox message delivery guidance:
      $gather-routing.output

      Produce a plan with:
      1. **Scope** — what this feature includes and explicitly excludes
      2. **Approach** — high-level technical approach, referencing existing architecture
      3. **Implementation steps** — ordered list of concrete steps with file paths
      4. **Dependencies** — any prerequisites or blocking items
      5. **Open questions** — things that need resolution before implementation
      6. **Harness assignment** — which harness (archon / opencode / goose) should own each step
      7. **Handoff artifacts** — what each harness must pass to the next harness at each handoff point

      Be specific. Reference actual files and repos from the maps. If a step mixes concerns, split it into separate steps owned by different harnesses.
    depends_on: [gather-context, gather-routing]
