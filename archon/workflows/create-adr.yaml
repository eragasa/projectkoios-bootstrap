name: create-adr
description: Generate a new Architecture Decision Record following the existing ADR format
provider: codex
worktree:
  enabled: false

nodes:
  - id: generate
    prompt: |
      Generate an Architecture Decision Record (ADR) file and save it.

      Context from the user: $ARGUMENTS

      Follow the format of existing ADRs in the `architecture/` directory.

      Required sections:
      - Title (# adr.<YYYYMMDD>: <title>)
      - Status (Accepted / Proposed / Deprecated)
      - Context (why this decision is needed)
      - Decision (what was decided)
      - Rationale (why this option over others)
      - Consequences (what this means going forward)
      - Alternatives considered (other options and why they were rejected)

      Determine the filename as `adr.<YYYYMMDD>.md` using today's date and a
      short slug from the title.

      Write the file to the `architecture/` directory.

      Confirm the filename and path once written.
