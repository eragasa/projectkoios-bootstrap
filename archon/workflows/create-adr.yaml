name: create-adr
description: Generate a new Architecture Decision Record JSON document following the canonical ADR schema
provider: pi
worktree:
  enabled: false

nodes:
  - id: generate
    prompt: |
      Generate an Architecture Decision Record (ADR) JSON file and save it.

      Context from the user: $ARGUMENTS

      Follow the canonical ADR JSON schema used in this repository.
      Use exactly one architecture domain per ADR. This is a proposal, not an implementation plan.

      Required fields:
      - id
      - slug
      - title
      - status
      - context
      - decision
      - consequences
      - architecture_spec
      - acceptance_criteria
      - implementation_brief
      - resolved_open_questions
      - non_goals
      - validation_expectations
      - routing

      Use the repository convention for filenames:
      docs/architecture/adr/adr.YYYYMMDD.HHMMSS_<kebab-slug>.json

      Base the slug on the title, keep it short, and preserve the timestamp format.

      Write the file to docs/architecture/adr/.

      Confirm the filename and path once written.
