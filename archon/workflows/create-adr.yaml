name: create-adr
description: Generate a new Architecture Decision Record following the canonical ADR format
provider: pi
worktree:
  enabled: false

nodes:
  - id: generate
    prompt: |
      Generate an Architecture Decision Record (ADR) file and save it.

      Context from the user: $ARGUMENTS

      Follow the canonical ADR format used in this repository.
      Use exactly one architecture domain per ADR. This is a proposal, not an implementation plan.

      Required sections:
      - Title (# ADR YYYYMMDD.HHMMSS: <Title>)
      - Status (draft)
      - Context
      - Decision
      - Consequences
      - architecture-spec
      - acceptance-criteria
      - implementation-brief
      - resolved-open-questions
      - non-goals
      - validation-expectations
      - routing

      Use the repository convention for filenames:
      docs/architecture/adr/adr.YYYYMMDD.HHMMSS_<kebab-slug>.md

      Base the slug on the title, keep it short, and preserve the timestamp format.

      Write the file to docs/architecture/adr/.

      Confirm the filename and path once written.
