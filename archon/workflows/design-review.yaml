name: design-review
description: Review a design document or ADR and provide structured feedback
provider: pi

nodes:
  - id: fetch-doc
    bash: |
      path="${1:-architecture/}"
      if [ -f "$path" ]; then
        cat "$path"
      else
        echo "No file specified. Available files:" && ls -1 "$path" 2>/dev/null || echo "architecture/ directory not found"
      fi

  - id: review
    prompt: |
      Review the following design document for Project Koios:

      $fetch-doc.output

      Provide structured feedback covering:
      1. Clarity — is the proposal clearly stated?
      2. Consistency — does it align with existing ADRs and architecture?
      3. Completeness — are there missing sections or unanswered questions?
      4. Risks — what are the downsides or trade-offs?
      5. Recommendations — specific suggestions for improvement

      Be constructive and specific. Reference exact lines or phrases where relevant.
    depends_on: [fetch-doc]
